<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>表格查询</title>
<script src="data/data.js"></script>
<script src="libs/xlsx.full.min.js"></script>
<style>
  :root {
    --primary: #3370FF;
    --primary-dark: #2B5FD9;
    --text-1: #1F2329;
    --text-2: #646A73;
    --text-3: #8F959E;
    --border: #E5E6EB;
    --border-light: #EFF0F1;
    --header-bg: #F5F6F7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #EAF1FB 0%, #F3F0FA 45%, #EDF4F1 100%);
    min-height: 100vh;
    color: var(--text-1);
    padding: 32px 16px 48px;
  }
  .page { max-width: 1600px; margin: 0 auto; }
  .card {
    background: rgba(255, 255, 255, .94);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 16px;
    box-shadow: 0 6px 24px rgba(31, 35, 41, .08), 0 1px 2px rgba(31, 35, 41, .04);
    padding: 28px 28px 24px;
  }
  .table-select-row { margin-bottom: 18px; }
  .table-select-row label { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 6px; }
  .table-select-row select {
    width: 100%; height: 38px; padding: 0 10px; font-size: 14px; color: var(--text-1);
    border: 1px solid var(--border); border-radius: 8px; background: #fff; outline: none;
    cursor: pointer; appearance: auto;
  }
  .table-select-row select:focus { border-color: var(--primary); }
  h1.title { font-size: 21px; font-weight: 700; line-height: 1.4; word-break: break-all; }
  p.desc { font-size: 13px; color: var(--text-2); line-height: 1.7; margin-top: 8px; white-space: pre-wrap; word-break: break-all; }
  .divider { height: 1px; background: var(--border-light); margin: 18px 0; }
  .filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
  .filter-item .label { font-size: 13px; font-weight: 500; margin-bottom: 6px; word-break: break-all; }
  .filter-item input {
    width: 100%; height: 38px; padding: 0 12px; font-size: 14px; color: var(--text-1);
    border: 1px solid var(--border); border-radius: 8px; background: #fff; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .filter-item input::placeholder { color: #BBBFC4; }
  .filter-item input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(51, 112, 255, .12); }
  .query-row { margin-top: 20px; display: flex; gap: 10px; align-items: center; }
  button.query {
    flex: 1; height: 44px; border: none; border-radius: 9px; cursor: pointer;
    background: var(--primary); color: #fff; font-size: 16px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    transition: background .15s, transform .05s;
    -webkit-tap-highlight-color: transparent;
  }
  button.query:hover { background: var(--primary-dark); }
  button.query:active { transform: scale(.99); }
  button.query svg { width: 17px; height: 17px; flex: none; }
  a.clear-link {
    flex: none; font-size: 13px; color: var(--text-3); text-decoration: none; cursor: pointer;
    padding: 6px 8px;
  }
  a.clear-link:hover { color: var(--text-2); }

  .result-area { margin-top: 22px; }
  .result-header {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
    margin-bottom: 10px;
  }
  .result-count { font-size: 15px; color: var(--text-2); }
  .result-count b { color: var(--text-1); font-size: 19px; font-weight: 700; margin: 0 2px; }
  .result-actions { display: flex; gap: 8px; }
  .result-actions button {
    height: 30px; padding: 0 12px; font-size: 12.5px; color: var(--text-2); background: #fff;
    border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px; transition: all .15s;
  }
  .result-actions button:hover { color: var(--primary); border-color: var(--primary); }
  .table-wrap {
    overflow: auto; max-height: 70vh; border: 1px solid #E2E4E8; border-radius: 10px;
    -webkit-overflow-scrolling: touch; background: #fff;
  }
  table.result { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 15px; }
  table.result th {
    position: sticky; top: 0; z-index: 2; background: var(--header-bg); color: var(--text-2);
    font-size: 14px; font-weight: 600; text-align: left; padding: 11px 14px;
    white-space: normal; word-break: break-word; overflow-wrap: anywhere;
    cursor: pointer; border-bottom: 1px solid var(--border-light); user-select: none;
    vertical-align: bottom; min-width: 88px;
  }
  table.result th:hover { color: var(--text-1); }
  table.result th .arrow { font-size: 10px; margin-left: 3px; color: var(--primary); white-space: nowrap; }
  table.result td {
    padding: 11px 14px; border-bottom: 1px solid #F2F3F5;
    white-space: normal; word-break: break-word; overflow-wrap: anywhere;
    color: var(--text-1); line-height: 1.6; vertical-align: top; min-width: 88px;
  }
  table.result tbody tr:nth-child(even) { background: #FAFBFC; }
  table.result tbody tr:hover { background: #F0F4FF; }
  table.result td.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.result th.num-head { text-align: right; }
  table.result td:first-child, table.result th:first-child { font-weight: 600; }
  table.result td mark, .result-count mark {
    background: none; color: var(--primary); font-weight: 700; padding: 0;
  }
  .pager {
    display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-top: 12px;
    font-size: 13px; color: var(--text-2); flex-wrap: wrap;
  }
  .pager button {
    height: 28px; min-width: 28px; padding: 0 8px; font-size: 13px; color: var(--text-2);
    background: #fff; border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
  }
  .pager button:hover:not(:disabled) { color: var(--primary); border-color: var(--primary); }
  .pager button:disabled { opacity: .4; cursor: default; }
  .pager .page-info { padding: 0 4px; }

  .placeholder { padding: 36px 0; text-align: center; }
  .placeholder .icon { font-size: 30px; margin-bottom: 10px; color: #C9CDD4; }
  .placeholder p { font-size: 13px; color: var(--text-3); line-height: 1.8; }
  .gate { padding: 30px 0 18px; text-align: center; }
  .gate .gate-icon { font-size: 36px; margin-bottom: 12px; }
  .gate .gate-tip { font-size: 14px; color: var(--text-2); margin-bottom: 16px; }
  .gate .gate-row { display: flex; gap: 10px; max-width: 400px; margin: 0 auto; }
  .gate .gate-row input {
    flex: 1; height: 42px; padding: 0 12px; font-size: 14px;
    border: 1px solid var(--border); border-radius: 8px; outline: none; background: #fff;
  }
  .gate .gate-row input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(51, 112, 255, .12); }
  .gate .gate-row button {
    flex: none; height: 42px; padding: 0 20px; border: none; border-radius: 8px;
    background: var(--primary); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background .15s; -webkit-tap-highlight-color: transparent;
  }
  .gate .gate-row button:hover { background: var(--primary-dark); }
  .gate .gate-err { color: #F54A45; font-size: 12.5px; margin-top: 10px; }
  .footer {
    text-align: center; font-size: 12px; color: #A9AEB8; margin-top: 18px; line-height: 1.8;
    white-space: pre-line;
  }
  .footer a { color: #A9AEB8; }

  @media (max-width: 620px) {
    body { padding: 14px 10px 30px; }
    .card { padding: 18px 16px 16px; border-radius: 12px; }
    h1.title { font-size: 18px; }
    .filter-grid { grid-template-columns: 1fr; gap: 12px; }
    .query-row { margin-top: 16px; }
    .table-wrap { max-height: 62vh; border-radius: 8px; }
    table.result { font-size: 14px; }
    table.result th { padding: 9px 10px; font-size: 13px; min-width: 96px; }
    table.result td { padding: 9px 10px; min-width: 96px; }
    .result-count { font-size: 14px; }
    .result-count b { font-size: 17px; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="card">
    <div class="table-select-row" id="tableSelectRow" hidden>
      <label for="tableSelect">选择表格</label>
      <select id="tableSelect"></select>
    </div>
    <h1 class="title" id="pageTitle"></h1>
    <p class="desc" id="pageDesc"></p>
    <div class="divider"></div>
    <div class="gate" id="gate" hidden>
      <div class="gate-icon">&#128274;</div>
      <p class="gate-tip">本查询系统已开启密码保护，请输入密码后查询</p>
      <div class="gate-row">
        <input type="password" id="gateInput" placeholder="请输入密码" autocomplete="off">
        <button id="gateBtn">进入查询</button>
      </div>
      <p class="gate-err" id="gateErr" hidden>密码错误，请重试</p>
    </div>
    <div class="filter-grid" id="filterGrid"></div>
    <div class="query-row">
      <button class="query" id="queryBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
        查询
      </button>
      <a class="clear-link" id="clearLink" hidden>清空条件</a>
    </div>
    <div class="result-area" id="resultArea" hidden>
      <div class="result-header">
        <span class="result-count" id="resultCount"></span>
        <span class="result-actions">
          <button id="exportXlsx">导出 Excel</button>
          <button id="exportCsv">导出 CSV</button>
        </span>
      </div>
      <div class="table-wrap">
        <table class="result" id="resultTable">
          <thead id="resultHead"></thead>
          <tbody id="resultBody"></tbody>
        </table>
      </div>
      <div class="pager" id="pager"></div>
    </div>
    <div class="placeholder" id="initPlaceholder" hidden>
      <div class="icon">&#128269;</div>
      <p id="initPlaceholderText"></p>
    </div>
  </div>
  <div class="footer" id="footer"></div>
</div>

<script>
(function () {
  'use strict';
  var DATA = window.__TABLE_QUERY_DATA__ || { tables: [] };
  var tables = (DATA.tables || []).filter(function (t) {
    return t && t.columns && t.columns.length && Array.isArray(t.rows);
  });
  var themeColor = DATA.themeColor || '#3370FF';
  var PASS = DATA.password || '';   // 后台设置的查询密码
  var unlocked = !PASS;             // 是否已通过密码验证

  var PAGE_SIZE = 50;

  // ---- 运行状态 ----
  var tableId = null;
  var filters = [];          // [{col, input}]
  var matched = null;        // 查询命中的行
  var lastConds = [];        // 本次查询使用的条件 [{col, q}]
  var sortCol = null, sortDir = 0;
  var page = 1;
  var queried = false;

  var $ = function (id) { return document.getElementById(id); };

  // ---- 工具 ----
  function toText(v) {
    if (v === null || v === undefined) return '';
    if (v instanceof Date) {
      var p = function (n) { return (n < 10 ? '0' : '') + n; };
      var s = v.getFullYear() + '-' + p(v.getMonth() + 1) + '-' + p(v.getDate());
      if (v.getHours() || v.getMinutes() || v.getSeconds())
        s += ' ' + p(v.getHours()) + ':' + p(v.getMinutes()) + ':' + p(v.getSeconds());
      return s;
    }
    return String(v);
  }
  function isNumStr(s) { return s !== '' && isFinite(Number(s)); }

  // 单元格与条件匹配：双方都是数字时按数值相等（0.5 不会误中 10.5），否则按不区分大小写的包含
  function cellMatch(cellVal, q) {
    var cs = toText(cellVal).trim();
    var qs = String(q).trim();
    if (qs === '') return true;
    if (cs === '') return false;
    if (isNumStr(cs) && isNumStr(qs)) return Number(cs) === Number(qs);
    return cs.toLowerCase().indexOf(qs.toLowerCase()) !== -1;
  }
  // 快速排序比较器（几万行也能瞬间完成）
  function cmpCells(a, b) {
    var ta = a === null || a === undefined ? '' : toText(a);
    var tb = b === null || b === undefined ? '' : toText(b);
    if (ta === '' && tb === '') return 0;
    if (ta === '') return 1;
    if (tb === '') return -1;
    var an = Number(ta), bn = Number(tb);
    if (isFinite(an) && isFinite(bn)) return an - bn;
    return ta < tb ? -1 : ta > tb ? 1 : 0;
  }
  function currentTable() {
    for (var i = 0; i < tables.length; i++) if (tables[i].id === tableId) return tables[i];
    return null;
  }
  function effFilterColumns(t) {
    var fc = t.filterColumns || [];
    return fc.filter(function (c) { return t.columns.indexOf(c) !== -1; });
  }
  // 结果显示列：顺序与勾选完全跟随后台配置；未配置或全不选 = 全部列（原顺序）
  function effDisplayColumns(t) {
    var list = (t.displayColumns || []).filter(function (c) { return t.columns.indexOf(c) !== -1; });
    return list.length ? list : t.columns.slice();
  }

  // ---- 主题色 ----
  function applyTheme() {
    document.documentElement.style.setProperty('--primary', themeColor);
    var m = /^#?([0-9a-f]{6})$/i.exec(themeColor);
    if (m) {
      var n = parseInt(m[1], 16);
      var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
      var lum = 0.299 * r + 0.587 * g + 0.114 * b;
      var darker = lum > 150
        ? 'rgb(' + Math.max(0, r - 26) + ',' + Math.max(0, g - 26) + ',' + Math.max(0, b - 26) + ')'
        : 'rgb(' + Math.min(255, r + 26) + ',' + Math.min(255, g + 26) + ',' + Math.min(255, b + 26) + ')';
      document.documentElement.style.setProperty('--primary-dark', darker);
    }
  }

  // ---- 表切换 / 筛选区渲染 ----
  function initTableSelect() {
    var row = $('tableSelectRow'), sel = $('tableSelect');
    if (tables.length <= 1) { row.hidden = true; return; }
    row.hidden = false;
    sel.innerHTML = '';
    tables.forEach(function (t) {
      var o = document.createElement('option');
      o.value = t.id;
      o.textContent = t.name + '（' + t.rows.length + ' 行）';
      sel.appendChild(o);
    });
    sel.value = tableId;
    sel.onchange = function () { switchTable(sel.value); };
  }

  function switchTable(id) {
    tableId = id;
    filters = [];
    matched = null;
    lastConds = [];
    sortCol = null; sortDir = 0;
    page = 1;
    queried = false;
    renderHead();
    renderFilters();
    renderResult();
    $('resultArea').hidden = true;
    var t = currentTable();
    if (t) {
      document.title = t.name + ' · 查询';
      try { var u = new URL(location.href); u.searchParams.set('table', t.id); history.replaceState(null, '', u); } catch (e) {}
    }
  }

  function renderHead() {
    var t = currentTable();
    if (!t) return;
    $('pageTitle').textContent = t.name || '表格查询';
    $('pageDesc').textContent = t.description || '';
    $('pageDesc').style.display = t.description ? '' : 'none';
  }

  function renderFilters() {
    var t = currentTable();
    var grid = $('filterGrid');
    grid.innerHTML = '';
    if (!t) return;
    filters = [];
    effFilterColumns(t).forEach(function (col) {
      var item = document.createElement('div');
      item.className = 'filter-item';
      var label = document.createElement('div');
      label.className = 'label';
      label.textContent = col;
      var input = document.createElement('input');
      input.type = 'text';
      input.placeholder = '请输入';
      input.setAttribute('autocomplete', 'off');
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') runQuery();
      });
      input.addEventListener('input', updateClearLink);
      item.appendChild(label);
      item.appendChild(input);
      grid.appendChild(item);
      filters.push({ col: col, input: input });
    });
    updateClearLink();
  }

  function updateClearLink() {
    var any = filters.some(function (f) { return f.input.value.trim() !== ''; });
    $('clearLink').hidden = !any;
  }

  // ---- 查询 ----
  function runQuery() {
    var t = currentTable();
    if (!t) return;
    var conds = [];
    filters.forEach(function (f) {
      var v = f.input.value.trim();
      if (v !== '') conds.push({ col: f.col, q: v });
    });
    // 预计算每列的条件（小写），供结果高亮使用
    var condIdx = {};
    conds.forEach(function (c) {
      var idx = t.columns.indexOf(c.col);
      if (idx !== -1) (condIdx[idx] = condIdx[idx] || []).push(c.q.toLowerCase());
    });
    var condList = [];
    for (var k in condIdx) condList.push({ idx: k | 0, qs: condIdx[k] });

    matched = t.rows.filter(function (row) {
      for (var i = 0; i < condList.length; i++) {
        var ok = false, cd = condList[i];
        for (var j = 0; j < cd.qs.length; j++) {
          if (cellMatch(row[cd.idx], cd.qs[j])) { ok = true; break; }
        }
        if (!ok) return false;
      }
      return true;
    });
    lastConds = condList;
    sortCol = null; sortDir = 0;
    page = 1;
    queried = true;
    renderResult();
    $('resultArea').hidden = false;
    $('resultArea').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // ---- 结果渲染 ----
  function sortedRows() {
    var rows = matched || [];
    if (!sortCol || !sortDir) return rows;
    var t = currentTable();
    var idx = t.columns.indexOf(sortCol);
    if (idx === -1) return rows;
    var dir = sortDir;
    return rows.slice().sort(function (a, b) { return dir * cmpCells(a[idx], b[idx]); });
  }

  // 在单元格中高亮命中的关键词（用 DOM 构建，安全无注入）
  function appendMarked(td, text, qs) {
    if (!qs || !qs.length) { td.textContent = text; return; }
    var lower = text.toLowerCase(), pos = 0;
    while (true) {
      var best = -1, bestLen = 0;
      for (var k = 0; k < qs.length; k++) {
        var f = lower.indexOf(qs[k], pos);
        if (f !== -1 && (best === -1 || f < best || (f === best && qs[k].length > bestLen))) { best = f; bestLen = qs[k].length; }
      }
      if (best === -1) break;
      if (best > pos) td.appendChild(document.createTextNode(text.slice(pos, best)));
      var mk = document.createElement('mark');
      mk.textContent = text.substr(best, bestLen);
      td.appendChild(mk);
      pos = best + bestLen;
    }
    if (pos < text.length) td.appendChild(document.createTextNode(text.slice(pos)));
    if (!td.firstChild) td.textContent = text;
  }

  function renderResult() {
    var t = currentTable();
    if (!t || !queried) {
      $('initPlaceholder').hidden = false;
      $('initPlaceholderText').textContent = '输入条件后点击「查询」';
      return;
    }
    $('initPlaceholder').hidden = true;
    var dispCols = effDisplayColumns(t);
    var rows = sortedRows();
    var total = rows.length;
    var pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if (page > pages) page = pages;
    var view = rows.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);

    $('resultCount').innerHTML = '共 <b>' + total + '</b> 条结果'
      + (pages > 1 ? ' · 第 ' + page + ' / ' + pages + ' 页' : '');

    // 每个显示列对应的条件（用于高亮）
    var qsByColIdx = {};
    lastConds.forEach(function (c) { qsByColIdx[c.idx] = c.qs; });

    // 表头（数字列右对齐，与数据对齐）
    var colIsNum = {};
    dispCols.forEach(function (col) {
      var ci = t.columns.indexOf(col);
      colIsNum[col] = view.length > 0 && view.every(function (r) {
        var txt = toText(r[ci]);
        return txt === '' || isNumStr(txt);
      });
    });
    var thead = $('resultHead');
    thead.innerHTML = '';
    var tr = document.createElement('tr');
    dispCols.forEach(function (col) {
      var th = document.createElement('th');
      if (colIsNum[col]) th.className = 'num-head';
      var span = document.createElement('span');
      span.textContent = col;
      th.appendChild(span);
      if (sortCol === col && sortDir) {
        var a = document.createElement('span');
        a.className = 'arrow';
        a.textContent = sortDir > 0 ? '▲' : '▼';
        th.appendChild(a);
      }
      th.title = '点击排序';
      th.addEventListener('click', function () {
        if (sortCol !== col) { sortCol = col; sortDir = 1; }
        else if (sortDir === 1) sortDir = -1;
        else { sortCol = null; sortDir = 0; }
        renderResult();
      });
      tr.appendChild(th);
    });
    thead.appendChild(tr);

    // 表体
    var tbody = $('resultBody');
    tbody.innerHTML = '';
    if (total === 0) {
      var trE = document.createElement('tr');
      var tdE = document.createElement('td');
      tdE.colSpan = dispCols.length;
      tdE.innerHTML = '<div class="placeholder" style="padding:28px 0"><div class="icon">&#128173;</div><p>未找到匹配的记录，请调整筛选条件后重试</p></div>';
      trE.appendChild(tdE);
      tbody.appendChild(trE);
    } else {
      view.forEach(function (row) {
        var tr2 = document.createElement('tr');
        dispCols.forEach(function (col) {
          var ci = t.columns.indexOf(col);
          var td = document.createElement('td');
          var txt = toText(row[ci]);
          appendMarked(td, txt, qsByColIdx[ci]);
          td.title = txt;
          if (isNumStr(txt)) td.className = 'num';
          tr2.appendChild(td);
        });
        tbody.appendChild(tr2);
      });
    }

    renderPager(total, pages);
  }

  function renderPager(total, pages) {
    var p = $('pager');
    p.innerHTML = '';
    if (pages <= 1) return;
    function btn(text, target, disabled) {
      var b = document.createElement('button');
      b.textContent = text;
      b.disabled = disabled || target < 1 || target > pages;
      b.addEventListener('click', function () { page = target; renderResult(); });
      p.appendChild(b);
    }
    btn('上一页', page - 1, page <= 1);
    var info = document.createElement('span');
    info.className = 'page-info';
    info.textContent = page + ' / ' + pages + ' 页 · ' + total + ' 条';
    p.appendChild(info);
    btn('下一页', page + 1, page >= pages);
  }

  // ---- 导出（导出内容 = 结果显示列） ----
  function downloadBlob(blob, filename) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  }
  function stamp() {
    var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
  }
  function exportResults(type) {
    var t = currentTable();
    if (!t || !queried) return;
    var rows = sortedRows();
    if (!rows.length) { alert('当前没有可导出的结果'); return; }
    var dispCols = effDisplayColumns(t);
    var idxMap = dispCols.map(function (c) { return t.columns.indexOf(c); });
    var base = (t.name || '查询结果') + '-查询结果-' + stamp();
    if (type === 'csv' || typeof XLSX === 'undefined') {
      var esc = function (s) {
        s = toText(s);
        return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      };
      var lines = [dispCols.map(esc).join(',')];
      rows.forEach(function (r) {
        lines.push(idxMap.map(function (ci) { return esc(r[ci]); }).join(','));
      });
      downloadBlob(new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }), base + '.csv');
      if (type === 'xlsx') alert('Excel 组件未加载（libs/xlsx.full.min.js 缺失），已改为导出 CSV。');
    } else {
      var ws = XLSX.utils.aoa_to_sheet([dispCols].concat(rows.map(function (r) {
        return idxMap.map(function (ci) { return r[ci] instanceof Date ? toText(r[ci]) : r[ci]; });
      })));
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, '查询结果');
      var wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
      downloadBlob(new Blob([wbout], { type: 'application/octet-stream' }), base + '.xlsx');
    }
  }

  // ---- 密码锁定 ----
  function applyLock() {
    var locked = !unlocked;
    $('gate').hidden = !locked;
    $('tableSelectRow').hidden = locked || tables.length <= 1;
    $('filterGrid').style.display = locked ? 'none' : '';
    document.querySelector('.query-row').style.display = locked ? 'none' : 'flex';
    if (locked) {
      $('resultArea').hidden = true;
      $('initPlaceholder').hidden = true;
      setTimeout(function () { $('gateInput').focus(); }, 50);
    } else {
      $('initPlaceholder').hidden = false;
    }
  }
  function tryUnlock() {
    if ($('gateInput').value === PASS) {
      unlocked = true;
      try { sessionStorage.setItem('tq_unlocked', '1'); } catch (e) {}
      $('gateErr').hidden = true;
      applyLock();
    } else {
      $('gateErr').hidden = false;
      $('gateInput').select();
    }
  }

  // ---- 初始化 ----
  function init() {
    applyTheme();
    if (!tables.length) {
      $('pageTitle').textContent = '表格查询系统';
      $('pageDesc').style.display = 'none';
      $('filterGrid').innerHTML = '';
      $('queryBtn').disabled = true;
      $('initPlaceholder').hidden = false;
      $('initPlaceholderText').innerHTML = '管理员还未发布任何表格。<br>请先打开 admin.html 上传表格并发布。';
      $('footer').textContent = '';
      return;
    }
    var paramId = null;
    try { paramId = new URLSearchParams(location.search).get('table'); } catch (e) {}
    var startId = null;
    if (paramId && tables.some(function (t) { return t.id === paramId; })) startId = paramId;
    else {
      tables.forEach(function (t) { if (t.isDefault) startId = t.id; });
      if (!startId) startId = tables[0].id;
    }
    switchTable(startId);
    initTableSelect();
    $('initPlaceholder').hidden = false;
    $('initPlaceholderText').textContent = '输入条件后点击「查询」';

    if (PASS) {
      try { if (sessionStorage.getItem('tq_unlocked') === '1') unlocked = true; } catch (e) {}
      applyLock();
      $('gateBtn').addEventListener('click', tryUnlock);
      $('gateInput').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') tryUnlock();
      });
    }

    var foot = [];
    if (DATA.footerText) foot.push(String(DATA.footerText).trim());
    if (DATA.updatedAt) {
      try { foot.push('数据更新时间：' + new Date(DATA.updatedAt).toLocaleString('zh-CN')); } catch (e) {}
    }
    $('footer').textContent = foot.join('\n');

    $('queryBtn').addEventListener('click', runQuery);
    $('exportXlsx').addEventListener('click', function () { exportResults('xlsx'); });
    $('exportCsv').addEventListener('click', function () { exportResults('csv'); });
    $('clearLink').addEventListener('click', function () {
      filters.forEach(function (f) { f.input.value = ''; });
      updateClearLink();
      if (filters.length) filters[0].input.focus();
    });
  }

  init();

  // 调试/自动化入口（不影响正常使用）
  window.__TQ__ = {
    runQuery: runQuery,
    tryUnlock: tryUnlock,
    setCondition: function (col, value) {
      filters.forEach(function (f) { if (f.col === col) f.input.value = value; });
      updateClearLink();
    },
    get state() {
      return { tableId: tableId, matchedCount: matched ? matched.length : null,
               page: page, sortCol: sortCol, sortDir: sortDir };
    }
  };
})();
</script>
</body>
